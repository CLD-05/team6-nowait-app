<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Ten Nowait logo concepts</title>
  <desc id="desc">Ten vector logo concepts for the Nowait website style using tomato, amber, cream, mint, and bold ink outlines.</desc>
  <defs>
    <linearGradient id="hotBlend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a3c" />
      <stop offset="0.52" stop-color="#ff7a37" />
      <stop offset="1" stop-color="#ffb22e" />
    </linearGradient>
    <linearGradient id="warmLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c" />
      <stop offset="1" stop-color="#ffb22e" />
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <filter id="smallShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <style>
      .bg { fill: #fff6ef; }
      .card { fill: #fff; }
      .ink { fill: #231a14; }
      .cream { fill: #fff6ef; }
      .muted { fill: #7d6f63; }
      .tomato { fill: #ff5a3c; }
      .amber { fill: #ffb22e; }
      .mint { fill: #16b886; }
      .white { fill: #fff; }
      .line { stroke: #231a14; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
      .thinLine { stroke: #231a14; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
      .hotStroke { stroke: url(#warmLine); stroke-width: 15; stroke-linecap: round; fill: none; }
      .title { font: 900 64px Arial, Helvetica, sans-serif; letter-spacing: -3px; }
      .subtitle { font: 700 24px Arial, Helvetica, sans-serif; }
      .label { font: 900 24px Arial, Helvetica, sans-serif; }
      .logo { font: 900 80px Arial, Helvetica, sans-serif; letter-spacing: -5.6px; }
      .logoWide { font: 900 86px Arial, Helvetica, sans-serif; letter-spacing: -6px; }
      .logoMid { font: 900 70px Arial, Helvetica, sans-serif; letter-spacing: -5px; }
      .micro { font: 900 15px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; }
      .number { font: 900 30px Arial, Helvetica, sans-serif; letter-spacing: -1px; }
    </style>
  </defs>

  <rect class="bg" width="2200" height="1320" />
  <circle cx="92" cy="102" r="34" class="amber line" />
  <rect x="2046" y="72" width="58" height="58" rx="15" class="mint line" transform="rotate(10 2075 101)" />
  <circle cx="2102" cy="1210" r="28" class="tomato line" />

  <text x="126" y="104" class="title ink">Nowait logo concepts</text>
  <text x="130" y="146" class="subtitle muted">10 vector directions matched to the current tomato, amber, cream, bold-border website style.</text>

  <!-- 01 -->
  <g transform="translate(90 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">01 Ticket Pop</text>
    <g transform="translate(40 150) rotate(-3 150 60)" filter="url(#smallShadow)">
      <path d="M28 0 H292 Q320 0 320 28 V112 Q320 140 292 140 H28 Q0 140 0 112 V88 Q18 86 18 70 Q18 54 0 52 V28 Q0 0 28 0 Z" fill="url(#hotBlend)" class="line" />
      <text x="160" y="92" text-anchor="middle" class="logo white">Nowait</text>
      <circle cx="28" cy="70" r="8" class="cream thinLine" />
      <circle cx="292" cy="70" r="8" class="cream thinLine" />
    </g>
    <path d="M86 316 C148 334 232 330 294 310" class="hotStroke" />
  </g>

  <!-- 02 -->
  <g transform="translate(510 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">02 Fast Swoosh</text>
    <g transform="translate(34 164)">
      <text x="0" y="86" class="logoWide ink">Nowait</text>
      <path d="M14 112 C100 138 208 134 316 104" class="hotStroke" />
      <circle cx="264" cy="18" r="15" class="tomato line" />
    </g>
  </g>

  <!-- 03 -->
  <g transform="translate(930 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">03 Badge Bite</text>
    <g transform="translate(34 156)" filter="url(#smallShadow)">
      <rect x="0" y="0" width="312" height="132" rx="32" class="tomato line" />
      <circle cx="24" cy="66" r="13" class="cream thinLine" />
      <text x="166" y="86" text-anchor="middle" class="logo white">Nowait</text>
      <rect x="94" y="112" width="126" height="40" rx="20" class="amber thinLine" />
      <text x="157" y="138" text-anchor="middle" class="micro ink">NO LINE</text>
    </g>
  </g>

  <!-- 04 -->
  <g transform="translate(1350 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">04 Capsule Blend</text>
    <g transform="translate(22 142)">
      <path d="M118 20 C190 2 306 14 326 60 C350 114 292 154 168 146 C70 140 22 110 34 66 C42 40 74 30 118 20 Z" fill="url(#hotBlend)" class="line" filter="url(#smallShadow)" />
      <text x="8" y="102" class="logoWide ink">Nowait</text>
      <path d="M78 136 C156 158 244 154 314 130" fill="none" stroke="#ffb22e" stroke-width="11" stroke-linecap="round" />
    </g>
  </g>

  <!-- 05 -->
  <g transform="translate(1770 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">05 Queue Zero</text>
    <g transform="translate(32 150)">
      <text x="0" y="92" class="logoWide ink">Nowait</text>
      <g transform="translate(238 -6) rotate(8 50 58)" filter="url(#smallShadow)">
        <rect x="0" y="0" width="100" height="116" rx="20" class="amber line" />
        <text x="50" y="44" text-anchor="middle" class="micro ink">WAIT</text>
        <text x="50" y="86" text-anchor="middle" class="number ink">#0</text>
      </g>
      <path d="M10 118 C92 134 184 132 266 114" fill="none" stroke="#ff5a3c" stroke-width="14" stroke-linecap="round" />
    </g>
  </g>

  <!-- 06 -->
  <g transform="translate(90 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">06 Split Word</text>
    <g transform="translate(42 156)">
      <text x="0" y="88" class="logo ink">No</text>
      <g transform="translate(120 0) rotate(-2 100 64)" filter="url(#smallShadow)">
        <rect x="0" y="0" width="198" height="112" rx="24" fill="url(#hotBlend)" class="line" />
        <text x="99" y="78" text-anchor="middle" class="logo white">wait</text>
      </g>
      <rect x="18" y="128" width="96" height="34" rx="17" class="amber thinLine" />
      <text x="66" y="151" text-anchor="middle" class="micro ink">NOW</text>
    </g>
  </g>

  <!-- 07 -->
  <g transform="translate(510 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">07 Plate Mark</text>
    <g transform="translate(38 130)">
      <ellipse cx="154" cy="118" rx="154" ry="86" class="cream line" filter="url(#smallShadow)" />
      <ellipse cx="154" cy="118" rx="120" ry="58" fill="none" stroke="#ffb22e" stroke-width="10" />
      <text x="154" y="140" text-anchor="middle" class="logoMid ink">Nowait</text>
      <path d="M52 186 C116 210 218 206 290 182" class="hotStroke" />
    </g>
  </g>

  <!-- 08 -->
  <g transform="translate(930 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">08 Corner Label</text>
    <g transform="translate(32 162)">
      <rect x="0" y="0" width="312" height="142" rx="28" class="cream line" filter="url(#smallShadow)" />
      <path d="M0 36 Q0 0 36 0 H142 L0 142 Z" class="tomato" />
      <text x="156" y="94" text-anchor="middle" class="logo ink">Nowait</text>
      <circle cx="272" cy="28" r="14" class="amber thinLine" />
    </g>
  </g>

  <!-- 09 -->
  <g transform="translate(1350 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">09 Speed Tag</text>
    <g transform="translate(30 154) rotate(-4 160 75)" filter="url(#smallShadow)">
      <path d="M20 0 H258 L320 70 L258 140 H20 Q0 140 0 120 V20 Q0 0 20 0 Z" fill="url(#hotBlend)" class="line" />
      <circle cx="258" cy="70" r="14" class="cream thinLine" />
      <text x="134" y="92" text-anchor="middle" class="logo white">Nowait</text>
    </g>
    <path d="M92 330 C160 348 236 344 296 322" class="hotStroke" />
  </g>

  <!-- 10 -->
  <g transform="translate(1770 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">10 Hero Wordmark</text>
    <g transform="translate(30 162)">
      <path d="M24 96 C42 36 118 10 204 18 C284 26 330 64 316 112 C300 166 210 176 112 158 C58 148 16 124 24 96 Z" fill="#ffe6df" class="line" filter="url(#smallShadow)" />
      <path d="M58 132 C132 156 230 154 304 128" fill="none" stroke="#ff5a3c" stroke-width="18" stroke-linecap="round" />
      <path d="M74 46 C126 28 216 30 286 54" fill="none" stroke="#ffb22e" stroke-width="12" stroke-linecap="round" />
      <text x="160" y="112" text-anchor="middle" class="logo ink">Nowait</text>
    </g>
  </g>
</svg>
