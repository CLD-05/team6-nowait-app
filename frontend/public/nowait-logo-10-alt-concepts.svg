<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Ten alternate Nowait logo concepts</title>
  <desc id="desc">Ten alternate vector logo concepts for Nowait, different from the previous set, using the website palette.</desc>
  <defs>
    <linearGradient id="warmBlend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a3c" />
      <stop offset="0.58" stop-color="#ff7838" />
      <stop offset="1" stop-color="#ffb22e" />
    </linearGradient>
    <linearGradient id="lineBlend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb22e" />
      <stop offset="1" stop-color="#ff5a3c" />
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <filter id="smallShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <style>
      .bg { fill: #fff6ef; }
      .card { fill: #fff; }
      .ink { fill: #231a14; }
      .cream { fill: #fff6ef; }
      .muted { fill: #7d6f63; }
      .tomato { fill: #ff5a3c; }
      .tomatoLight { fill: #ffe6df; }
      .amber { fill: #ffb22e; }
      .mint { fill: #16b886; }
      .white { fill: #fff; }
      .line { stroke: #231a14; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
      .thinLine { stroke: #231a14; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
      .warmStroke { stroke: url(#lineBlend); stroke-width: 15; stroke-linecap: round; fill: none; }
      .title { font: 900 64px Arial, Helvetica, sans-serif; letter-spacing: -3px; }
      .subtitle { font: 700 24px Arial, Helvetica, sans-serif; }
      .label { font: 900 24px Arial, Helvetica, sans-serif; }
      .logo { font: 900 80px Arial, Helvetica, sans-serif; letter-spacing: -5.6px; }
      .logoWide { font: 900 86px Arial, Helvetica, sans-serif; letter-spacing: -6px; }
      .logoMid { font: 900 70px Arial, Helvetica, sans-serif; letter-spacing: -5px; }
      .logoSmall { font: 900 60px Arial, Helvetica, sans-serif; letter-spacing: -4px; }
      .micro { font: 900 15px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect class="bg" width="2200" height="1320" />
  <circle cx="92" cy="102" r="34" class="amber line" />
  <rect x="2046" y="72" width="58" height="58" rx="15" class="mint line" transform="rotate(10 2075 101)" />
  <circle cx="2102" cy="1210" r="28" class="tomato line" />

  <text x="126" y="104" class="title ink">Nowait alternate logo concepts</text>
  <text x="130" y="146" class="subtitle muted">10 new directions, avoiding the previous ticket/stamp-heavy set while keeping the current website style.</text>

  <!-- 01 -->
  <g transform="translate(90 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">01 Clock O</text>
    <g transform="translate(38 166)">
      <text x="0" y="86" class="logoWide ink">N</text>
      <circle cx="102" cy="58" r="44" class="amber line" filter="url(#smallShadow)" />
      <path d="M102 58 L102 30 M102 58 L128 72" fill="none" stroke="#231a14" stroke-width="7" stroke-linecap="round" />
      <text x="138" y="86" class="logoWide ink">wait</text>
      <path d="M24 120 C106 142 214 138 316 112" class="warmStroke" />
    </g>
  </g>

  <!-- 02 -->
  <g transform="translate(510 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">02 Pin Drop</text>
    <g transform="translate(32 146)">
      <path d="M284 18 C322 18 348 44 348 80 C348 132 284 178 284 178 C284 178 220 132 220 80 C220 44 246 18 284 18 Z" fill="url(#warmBlend)" class="line" filter="url(#smallShadow)" />
      <circle cx="284" cy="78" r="20" class="cream thinLine" />
      <text x="0" y="112" class="logoWide ink">Nowait</text>
      <path d="M18 140 C90 164 190 160 274 138" fill="none" stroke="#16b886" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>

  <!-- 03 -->
  <g transform="translate(930 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">03 Folded Ribbon</text>
    <g transform="translate(34 160)" filter="url(#smallShadow)">
      <path d="M0 26 H276 L322 72 L276 118 H0 L28 72 Z" fill="url(#warmBlend)" class="line" />
      <path d="M0 26 L28 72 L0 118 Z" class="amber thinLine" />
      <text x="158" y="92" text-anchor="middle" class="logo white">Nowait</text>
    </g>
  </g>

  <!-- 04 -->
  <g transform="translate(1350 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">04 Table Sign</text>
    <g transform="translate(44 128)">
      <path d="M24 92 H286 Q310 92 310 116 V182 Q310 206 286 206 H24 Q0 206 0 182 V116 Q0 92 24 92 Z" class="tomatoLight line" filter="url(#smallShadow)" />
      <path d="M36 92 L72 24 H238 L274 92" fill="none" stroke="#231a14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <text x="155" y="166" text-anchor="middle" class="logoMid ink">Nowait</text>
      <rect x="96" y="190" width="118" height="34" rx="17" class="amber thinLine" />
      <text x="155" y="212" text-anchor="middle" class="micro ink">OPEN NOW</text>
    </g>
  </g>

  <!-- 05 -->
  <g transform="translate(1770 230)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">05 Check Flow</text>
    <g transform="translate(28 166)">
      <text x="0" y="86" class="logoWide ink">Nowait</text>
      <path d="M40 132 L106 176 L310 58" fill="none" stroke="url(#lineBlend)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#smallShadow)" />
      <circle cx="278" cy="18" r="15" class="mint line" />
    </g>
  </g>

  <!-- 06 -->
  <g transform="translate(90 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">06 Steam Lift</text>
    <g transform="translate(40 140)">
      <path d="M106 30 C86 4 132 -8 112 -34 M164 34 C142 6 194 -4 174 -32 M220 32 C202 8 246 -2 230 -30" fill="none" stroke="#ff5a3c" stroke-width="9" stroke-linecap="round" />
      <text x="0" y="124" class="logoWide ink">Nowait</text>
      <path d="M22 154 C110 176 214 172 310 146" fill="none" stroke="#ffb22e" stroke-width="14" stroke-linecap="round" />
    </g>
  </g>

  <!-- 07 -->
  <g transform="translate(510 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">07 Menu Tab</text>
    <g transform="translate(48 132)" filter="url(#smallShadow)">
      <rect x="0" y="36" width="286" height="178" rx="24" class="cream line" />
      <rect x="34" y="0" width="132" height="58" rx="20" class="amber line" />
      <line x1="42" y1="94" x2="244" y2="94" class="thinLine" />
      <line x1="42" y1="138" x2="244" y2="138" class="thinLine" />
      <text x="143" y="176" text-anchor="middle" class="logoSmall ink">Nowait</text>
    </g>
  </g>

  <!-- 08 -->
  <g transform="translate(930 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">08 Route Loop</text>
    <g transform="translate(30 154)">
      <path d="M42 150 C24 64 114 10 198 34 C292 60 306 154 212 176 C138 194 74 180 42 150 Z" class="tomatoLight line" filter="url(#smallShadow)" />
      <path d="M70 142 C118 76 200 76 270 126" fill="none" stroke="#ffb22e" stroke-width="13" stroke-linecap="round" />
      <path d="M270 126 L248 126 L260 104" fill="none" stroke="#231a14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <text x="160" y="124" text-anchor="middle" class="logoMid ink">Nowait</text>
    </g>
  </g>

  <!-- 09 -->
  <g transform="translate(1350 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">09 Window Sign</text>
    <g transform="translate(42 122)">
      <rect x="0" y="64" width="296" height="154" rx="28" fill="url(#warmBlend)" class="line" filter="url(#smallShadow)" />
      <circle cx="74" cy="30" r="10" class="cream thinLine" />
      <circle cx="222" cy="30" r="10" class="cream thinLine" />
      <path d="M74 64 V30 H222 V64" fill="none" stroke="#231a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <text x="148" y="158" text-anchor="middle" class="logoSmall white">Nowait</text>
      <text x="148" y="190" text-anchor="middle" class="micro ink">READY TABLES</text>
    </g>
  </g>

  <!-- 10 -->
  <g transform="translate(1770 720)">
    <rect width="380" height="420" rx="28" class="card line" filter="url(#shadow)" />
    <text x="30" y="48" class="label ink">10 Bite Dot</text>
    <g transform="translate(34 162)">
      <text x="0" y="88" class="logoWide ink">Nowait</text>
      <circle cx="266" cy="18" r="24" class="amber line" filter="url(#smallShadow)" />
      <circle cx="276" cy="8" r="10" class="cream" />
      <path d="M22 122 C96 152 214 146 320 112" fill="none" stroke="#ff5a3c" stroke-width="18" stroke-linecap="round" />
      <path d="M210 142 C250 142 286 136 320 126" fill="none" stroke="#ffb22e" stroke-width="10" stroke-linecap="round" />
    </g>
  </g>
</svg>
