name: Backend CI/CD to AWS ECR
on:
  push:
    branches: [ develop, main ]
env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nowait-api
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 💡 Dockerfile 내부에서 멀티 스테이지 빌드로 Maven 패키징을 수행하므로, 
      # CI 러너 자체에서의 중복 Java 세팅 및 mvn package 스텝은 제거하여 빌드 타임을 단축합니다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      # 깃허브 refs/heads/develop 형태와 매칭하기 위한 환경변수 선언 편의성 확보
      - name: Set ENV variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "CONFIG_ENV=prod" >> $GITHUB_ENV
          else
            echo "CONFIG_ENV=dev" >> $GITHUB_ENV
          fi
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
      - name: Update image tag in nowait-config (GitOps)
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          git clone https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/${{ github.repository_owner }}/nowait-config.git
          cd nowait-config
          
          # deployment.yaml 파일 내 이미지 정보 치환
          sed -i "s|image:.*|image: $IMAGE_URI|" envs/$CONFIG_ENV/nowait-api/deployment.yaml
          
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "chore: update $CONFIG_ENV image to ${{ github.sha }}"
          
          # 💡 동시 푸시로 인한 충돌 방지를 위해 rebase 후 push 진행
          git pull --rebase origin main
          git push origin main
          

          # # 환경별 브랜치 분리(dev/ main) - 아래 사용
          # git pull --rebase origin $CONFIG_ENV
          # git push origin $CONFIG_ENV