name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_DIR: "."
  FRONTEND_DIR: "frontend"

jobs:
  backend-test:
    name: 1. Backend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run backend tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean test
          elif [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean test
          else
            echo "No Gradle or Maven wrapper found."
            exit 1
          fi

  frontend-test-and-build-check:
    name: 2. Frontend test and build check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend package
        run: |
          test -f package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
          REACT_APP_API_BASE_URL: http://localhost:8080
        run: npm run build