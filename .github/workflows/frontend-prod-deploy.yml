name: Frontend Prod Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-prod-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  FRONTEND_DIR: "frontend"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  frontend-test:
    name: 1. Frontend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Check frontend package
        run: |
          test -f package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vite frontend tests
        run: npm test -- --run

  build-and-deploy-frontend-prod:
    name: 2. Build and deploy frontend to prod S3
    runs-on: ubuntu-latest
    needs:
      - frontend-test

    environment: production

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials for prod
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend dist to prod S3
        working-directory: .
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "Vite build output not found: frontend/dist"
            exit 1
          fi

          aws s3 sync "frontend/dist" "s3://${{ vars.PROD_FRONTEND_S3_BUCKET }}" --delete