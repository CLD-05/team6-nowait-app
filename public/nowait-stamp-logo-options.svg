<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nowait stamp logo concepts</title>
  <desc id="desc">Three stamp-inspired Nowait logo concepts: seal stamp, ink stamp, and approved stamp.</desc>
  <defs>
    <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <style>
      .bg { fill: #fff6ef; }
      .card { fill: #fff; }
      .ink { fill: #231a14; }
      .muted { fill: #7d6f63; }
      .tomato { fill: #ff5a3c; }
      .tomatoLight { fill: #ffe6df; }
      .amber { fill: #ffb22e; }
      .mint { fill: #16b886; }
      .white { fill: #fff; }
      .line { stroke: #231a14; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
      .stampLine { stroke: #ff5a3c; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; fill: none; }
      .thinStamp { stroke: #ff5a3c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
      .title { font: 900 54px Arial, Helvetica, sans-serif; letter-spacing: -2px; }
      .label { font: 900 22px Arial, Helvetica, sans-serif; }
      .desc { font: 700 18px Arial, Helvetica, sans-serif; }
      .logo { font: 900 92px Arial, Helvetica, sans-serif; letter-spacing: -6px; }
      .logoWide { font: 900 104px Arial, Helvetica, sans-serif; letter-spacing: -7px; }
      .micro { font: 900 18px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; }
      .tiny { font: 900 14px Arial, Helvetica, sans-serif; letter-spacing: 1.8px; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" />
  <circle cx="88" cy="112" r="32" class="amber line" />
  <rect x="1438" y="88" width="52" height="52" rx="14" class="mint line" transform="rotate(10 1464 114)" />
  <circle cx="1510" cy="772" r="24" class="tomato line" />

  <text x="104" y="108" class="title ink">Nowait stamp logo concepts</text>
  <text x="108" y="146" class="desc muted">Stronger stamp direction, keeping the exact wordmark text as "Nowait".</text>

  <g transform="translate(90 220)">
    <rect x="0" y="0" width="440" height="540" rx="26" class="card line" filter="url(#hardShadow)" />
    <text x="34" y="58" class="label ink">01 Seal Stamp</text>
    <text x="34" y="88" class="desc muted">Round approval seal, bold and iconic</text>

    <g transform="translate(220 286) rotate(-6)" filter="url(#smallShadow)">
      <circle r="145" class="tomatoLight line" />
      <circle r="118" class="stampLine" />
      <circle r="86" class="thinStamp" />
      <text x="0" y="-106" text-anchor="middle" class="micro tomato">NO MORE WAITING</text>
      <text x="0" y="18" text-anchor="middle" class="logo tomato">Nowait</text>
      <text x="0" y="86" text-anchor="middle" class="micro tomato">FAST TABLE PASS</text>
      <path d="M-72 -54 L72 -54" class="thinStamp" />
      <path d="M-66 46 L66 46" class="thinStamp" />
      <circle cx="-104" cy="0" r="7" class="tomato" />
      <circle cx="104" cy="0" r="7" class="tomato" />
    </g>
  </g>

  <g transform="translate(580 220)">
    <rect x="0" y="0" width="440" height="540" rx="26" class="card line" filter="url(#hardShadow)" />
    <text x="34" y="58" class="label ink">02 Ink Stamp</text>
    <text x="34" y="88" class="desc muted">Rectangle stamp, strongest brand block</text>

    <g transform="translate(58 206) rotate(-4 162 76)" filter="url(#hardShadow)">
      <rect x="0" y="0" width="324" height="154" rx="20" class="tomatoLight line" />
      <rect x="16" y="16" width="292" height="122" rx="16" class="stampLine" />
      <text x="162" y="93" text-anchor="middle" class="logo tomato">Nowait</text>
      <text x="162" y="124" text-anchor="middle" class="tiny tomato">QUEUE SKIP STAMP</text>
      <path d="M24 34 H88" class="thinStamp" />
      <path d="M236 34 H300" class="thinStamp" />
      <path d="M28 132 H74" class="thinStamp" />
      <path d="M250 132 H296" class="thinStamp" />
      <circle cx="54" cy="74" r="4" class="tomato" />
      <circle cx="280" cy="92" r="4" class="tomato" />
      <circle cx="116" cy="128" r="3" class="tomato" />
    </g>

    <g transform="translate(94 396)">
      <rect x="0" y="0" width="252" height="46" rx="23" class="amber line" filter="url(#smallShadow)" />
      <text x="126" y="30" text-anchor="middle" class="micro ink">BEST FOR HEADER</text>
    </g>
  </g>

  <g transform="translate(1070 220)">
    <rect x="0" y="0" width="440" height="540" rx="26" class="card line" filter="url(#hardShadow)" />
    <text x="34" y="58" class="label ink">03 Approved Stamp</text>
    <text x="34" y="88" class="desc muted">Diagonal stamped badge, energetic</text>

    <g transform="translate(46 236) rotate(-12 174 82)" filter="url(#hardShadow)">
      <path d="M28 0 H320 Q348 0 348 28 V136 Q348 164 320 164 H28 Q0 164 0 136 V28 Q0 0 28 0 Z" class="tomatoLight line" />
      <path d="M34 24 H314 Q324 24 324 34 V130 Q324 140 314 140 H34 Q24 140 24 130 V34 Q24 24 34 24 Z" class="stampLine" />
      <text x="174" y="94" text-anchor="middle" class="logoWide tomato">Nowait</text>
      <text x="174" y="125" text-anchor="middle" class="tiny tomato">APPROVED TABLE ACCESS</text>
      <path d="M48 44 H116" class="thinStamp" />
      <path d="M232 44 H300" class="thinStamp" />
    </g>

    <g transform="translate(98 396)">
      <rect x="0" y="0" width="244" height="46" rx="23" class="tomato line" filter="url(#smallShadow)" />
      <text x="122" y="30" text-anchor="middle" class="micro white">LANDING HERO</text>
    </g>
  </g>
</svg>
