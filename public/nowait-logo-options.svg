<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nowait logo concept options</title>
  <desc id="desc">Three visual logo directions for the Nowait brand: stamp, ticket, and underline styles.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#231a14" flood-opacity="1" />
    </filter>
    <style>
      .bg { fill: #fff6ef; }
      .ink { fill: #231a14; }
      .muted { fill: #7d6f63; }
      .tomato { fill: #ff5a3c; }
      .amber { fill: #ffb22e; }
      .mint { fill: #16b886; }
      .white { fill: #fff; }
      .line { stroke: #231a14; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
      .thinLine { stroke: #231a14; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .title { font: 900 54px Arial, Helvetica, sans-serif; letter-spacing: -2px; }
      .label { font: 900 22px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .desc { font: 700 18px Arial, Helvetica, sans-serif; }
      .logo { font: 900 104px Arial, Helvetica, sans-serif; letter-spacing: -7px; }
      .logoSmall { font: 900 76px Arial, Helvetica, sans-serif; letter-spacing: -5px; }
      .micro { font: 900 18px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
      .number { font: 900 42px Arial, Helvetica, sans-serif; letter-spacing: -2px; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" />
  <circle cx="88" cy="112" r="32" class="amber line" />
  <rect x="1438" y="88" width="52" height="52" rx="14" class="mint line" transform="rotate(10 1464 114)" />
  <circle cx="1510" cy="772" r="24" class="tomato line" />

  <text x="104" y="108" class="title ink">Nowait logo directions</text>
  <text x="108" y="146" class="desc muted">Text is fixed as "Nowait". These options match the current tomato, amber, cream, bold-border landing style.</text>

  <g transform="translate(90 220)">
    <rect x="0" y="0" width="440" height="540" rx="26" class="white line" filter="url(#softShadow)" />
    <text x="34" y="58" class="label ink">01 Stamp</text>
    <text x="34" y="88" class="desc muted">Bold brand block, strongest impact</text>

    <g transform="translate(52 206) rotate(-3 168 62)" filter="url(#softShadow)">
      <rect x="0" y="0" width="336" height="126" rx="24" class="tomato line" />
      <circle cx="26" cy="63" r="12" class="bg thinLine" />
      <circle cx="310" cy="63" r="12" class="bg thinLine" />
      <text x="168" y="87" text-anchor="middle" class="logoSmall white">Nowait</text>
    </g>

    <g transform="translate(108 374)">
      <rect x="0" y="0" width="222" height="46" rx="23" class="amber thinLine" filter="url(#smallShadow)" />
      <text x="111" y="30" text-anchor="middle" class="micro ink">NO MORE LINES</text>
    </g>
  </g>

  <g transform="translate(580 220)">
    <rect x="0" y="0" width="440" height="540" rx="26" class="white line" filter="url(#softShadow)" />
    <text x="34" y="58" class="label ink">02 Ticket</text>
    <text x="34" y="88" class="desc muted">Queue-number detail, service meaning</text>

    <g transform="translate(44 222)">
      <text x="0" y="76" class="logo ink">Nowait</text>
      <path d="M26 99 C98 84 214 84 324 96" fill="none" stroke="#ff5a3c" stroke-width="16" stroke-linecap="round" />
      <g transform="translate(286 -70) rotate(7 58 72)" filter="url(#smallShadow)">
        <path d="M0 0 H116 A18 18 0 0 1 134 18 V126 A18 18 0 0 1 116 144 H0 A18 18 0 0 1 -18 126 V92 A18 18 0 0 0 -18 52 V18 A18 18 0 0 1 0 0 Z" class="amber line" />
        <text x="58" y="55" text-anchor="middle" class="micro ink">WAIT</text>
        <text x="58" y="104" text-anchor="middle" class="number ink">#0</text>
      </g>
    </g>

    <g transform="translate(82 374)">
      <rect x="0" y="0" width="276" height="46" rx="23" class="tomato thinLine" filter="url(#smallShadow)" />
      <text x="138" y="30" text-anchor="middle" class="micro white">RESERVATION TICKET</text>
    </g>
  </g>

  <g transform="translate(1070 220)">
    <rect x="0" y="0" width="440" height="540" rx="26" class="white line" filter="url(#softShadow)" />
    <text x="34" y="58" class="label ink">03 Underline</text>
    <text x="34" y="88" class="desc muted">Clean wordmark with sharp motion</text>

    <g transform="translate(48 232)">
      <text x="0" y="76" class="logo ink">Nowait</text>
      <circle cx="264" cy="6" r="13" class="tomato line" />
      <path d="M14 114 C76 136 190 130 336 104" fill="none" stroke="#ff5a3c" stroke-width="24" stroke-linecap="round" />
      <path d="M70 146 C160 160 250 150 318 132" fill="none" stroke="#ffb22e" stroke-width="10" stroke-linecap="round" />
    </g>

    <g transform="translate(104 374)">
      <rect x="0" y="0" width="232" height="46" rx="23" class="bg thinLine" filter="url(#smallShadow)" />
      <text x="116" y="30" text-anchor="middle" class="micro ink">FAST FOOD FLOW</text>
    </g>
  </g>
</svg>
