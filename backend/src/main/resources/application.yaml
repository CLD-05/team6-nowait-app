server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: team6-nowait-app

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nowait?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:nowait}
    password: ${DB_PASSWORD:nowait1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  mvc:
    async:
      # SseEmitter timeout 을 30분으로 만들어도 Spring MVC async 전역 기본값(약 30s)이
      # 먼저 깨어나 AsyncRequestTimeoutException 으로 SSE 가 강제 종료됐다.
      # 전역 async timeout 도 30분으로 늘려 emitter timeout 과 일치시킨다.
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT_MS:1800000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3000ms}
      # prod ElastiCache는 AUTH 토큰 + TLS를 쓴다 (REDIS_PASSWORD/REDIS_SSL_ENABLED로 주입).
      # 로컬/dev는 둘 다 비워두면 기존과 동일하게 평문/무인증으로 접속한다.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}

test:
  secret-token: ${TEST_SECRET_TOKEN:}

aws:
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:local-nowait-images}
    presigned-url-expiry-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    enable:
      tomcat: true
    distribution:
      # 기본값으로는 http_server_requests_seconds의 _count/_sum/_max만 노출되고
      # _bucket이 없어서 Grafana의 histogram_quantile(p95 레이턴시 패널)이 빈 값만
      # 반환했다. 히스토그램 버킷을 켜야 Prometheus 쪽에서 분위수 계산이 가능하다.
      percentiles-histogram:
        http.server.requests: true
        # DB 커넥션 획득 대기 p99(부하테스트 SLO ≤50ms) 측정용.
        # HikariCP acquire는 기본적으로 _count/_sum/_max만 노출돼 진짜 분위수를 못 구한다.
        # 히스토그램 버킷을 켜면 hikaricp_connections_acquire_seconds_bucket(le)가 생겨
        # 여러 파드에 걸쳐 histogram_quantile(0.99, ...)로 p99 산출이 가능해진다.
        hikaricp.connections.acquire: true
      # 50ms 임계 부근 해상도를 높이기 위한 SLO 경계 버킷 추가
      slo:
        hikaricp.connections.acquire: 10ms, 25ms, 50ms, 100ms

logging:
  level:
    org.hibernate.SQL: debug